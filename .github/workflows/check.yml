name: Check token (GH_PAT 확인)

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import kakao; kakao.check_pat()"
